<mat-card>
  <mat-toolbar class="toolbar">
    <span>Cursos Disponíveis</span>
  </mat-toolbar>
  <mat-card-content>
    @if (courses$ | async; as courses) {
      <div>
        <table mat-table [dataSource]="courses" class="mat-shadow-2">
          <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

          <ng-container matColumnDef="_id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let course">
              {{ course._id }}
            </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let course">
              {{ course.name }}
            </td>
          </ng-container>

          <!-- Category Column -->
          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef>Category</th>
            <td mat-cell *matCellDef="let course">
              {{ course.category }}
              <mat-icon aria-hidden="false" aria-label="Example home icon">{{
                course.category | category
              }}</mat-icon>
            </td>
          </ng-container>

          //Actions Column
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef>
              <button matMiniFab aria-label="Adicionar curso">
                <mat-icon (click)="onAddCourse()">add</mat-icon>
              </button>
            </mat-header-cell>

            <mat-cell *matCellDef="let course">
              <button matMiniFab aria-label="Editar curso">
                <mat-icon>edit</mat-icon>
              </button>

              <button matMiniFab aria-label="Deletar curso">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    } @else {
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    }
  </mat-card-content>
</mat-card>
