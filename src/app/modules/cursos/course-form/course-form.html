<mat-card>
  <mat-toolbar>Adicionar Curso</mat-toolbar>
  <mat-card-content>
    <form [formGroup]="form" class="full-width">
      <mat-form-field>
        <input matInput placeholder="Nome" aria-label="Nome" formControlName="name" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="category">
          <mat-option>None</mat-option>
          <mat-option value="null"></mat-option>
          <mat-option value="Front-end">Front-End</mat-option>
          <mat-option value="Back-end">Back-End</mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="var(--mat-system-primary)" (click)="onSubmit()">Salvar</button>
    <button matButton (click)="onCancel()">Cancelar</button>
  </mat-card-actions>
</mat-card>
