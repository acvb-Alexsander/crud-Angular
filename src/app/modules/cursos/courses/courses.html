<mat-card>
  <mat-toolbar class="toolbar">
    <span>Cursos Disponíveis</span>
  </mat-toolbar>
  <mat-card-content>
    <div class="column-flex mat-elevation-z8">
      @if (courses$ | async; as courses) {
        <div>
          <app-courses-list
            [courses]="courses"
            (add)="onAddCourse()"
            (edit)="onEdit($event)"
          ></app-courses-list>
        </div>
      } @else {
        <div class="loading-spinner">
          <mat-spinner></mat-spinner>
        </div>
      }
    </div>
  </mat-card-content>
</mat-card>
