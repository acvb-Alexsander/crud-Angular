<mat-table mat-table [dataSource]="courses" class="mat-shadow-2">
  <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

  <ng-container matColumnDef="_id">
    <mat-header-cell mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
    <mat-cell mat-cell *matCellDef="let course">
      {{ course._id }}
    </mat-cell>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <mat-header-cell mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
    <mat-cell mat-cell *matCellDef="let course">
      {{ course.name }}
    </mat-cell>
  </ng-container>

  <!-- Category Column -->
  <ng-container matColumnDef="category">
    <mat-header-cell mat-header-cell *matHeaderCellDef>Category</mat-header-cell>
    <mat-cell mat-cell *matCellDef="let course">
      {{ course.category }}
      <mat-icon aria-hidden="false" aria-label="Example home icon">{{
        course.category | category
      }}</mat-icon>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="action-column">
      <button matMiniFab aria-label="Adicionar curso">
        <mat-icon (click)="onAddCourse()"> add</mat-icon>
      </button>
    </mat-header-cell>

    <mat-cell *matCellDef="let course" class="action-column">
      <button class="miniButtons" matMiniFab aria-label="Editar curso">
        <mat-icon (click)="onEdit(course)">edit</mat-icon>
      </button>

      <button matMiniFab aria-label="Deletar curso">
        <mat-icon (click)="onDelete(course)">delete</mat-icon>
      </button>
    </mat-cell>
  </ng-container>
  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
</mat-table>
